  train_start: "2010-01-01"
  train_end: "2013-12-31"
  test_start: "2014-01-01"
  test_end: "2014-12-31"
  max_lookback_hours: 168
  target_column: "actual_load_mw"
  timestamp_column: "timestamp_ept"

features:
