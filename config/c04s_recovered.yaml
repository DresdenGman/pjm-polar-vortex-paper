    algorithm: "sklearn.ensemble.HistGradientBoostingRegressor"
    max_iter:
      value: 300
      provenance: "task07a_validity_audit.md"
    max_depth:
      value: 6
      provenance: "task07a_validity_audit.md"
    random_state:
      value: null
      provenance: "MISSING — no record found; set to 42 as recovery default"
      recovery_value: 42
