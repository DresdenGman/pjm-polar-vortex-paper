    loss: "quantile"
    max_iter:
      value: 300
      provenance: "task07b_quantile_forecasting_report.md"
    max_depth:
      value: 6
      provenance: "task07b_quantile_forecasting_report.md"
    random_state:
      value: 42
      provenance: "task07b_quantile_forecasting_report.md"
    learning_rate:
      value: 0.1
      provenance: "MISSING — no record found; using sklearn 1.7.2 default"
      recovery_notes: "This is a recovery assumption, NOT a recovered C04S setting"
    quantiles: [0.01, 0.05, 0.10, 0.50, 0.90, 0.95, 0.99]
