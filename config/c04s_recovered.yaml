      provenance: "MISSING — no record found; using sklearn 1.7.2 default"
      recovery_notes: "This is a recovery assumption, NOT a recovered C04S setting"
    library_version:
      value: "1.7.2"
      provenance: "MISSING — original sklearn version unknown; using recovery environment"

  qr_gbt:
