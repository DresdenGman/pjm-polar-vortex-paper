    - "day_of_week"
    - "month"
  load_lags:
    - "load_lag_1h"
    - "load_lag_24h"
    - "load_lag_168h"
  load_rolling:
    - "load_rolling_mean_24h"
    - "load_rolling_mean_168h"
    - "load_rolling_std_24h"
  weather:
    - "t_f"
    - "wind_chill"
    - "wind_speed"
    - "hdh"
    - "cdh"

models:
