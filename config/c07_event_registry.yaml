evaluation_rules:
  - Event selection is independent of model forecast errors.
  - Official PJM named-event windows form the primary event set.
  - ERA5 percentile rule resolves E2015 boundaries as sensitivity.
  - Contiguous event hours are serially dependent.
  - Each event is an independent evaluation unit.
  - Timestamps stored in America/New_York and UTC.

